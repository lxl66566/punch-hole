[package]
name         = "punch-hole-demo"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
description  = "Two-terminal demo of punch-hole over real sockets: a pairing relay plus a client and a server that chat over the punched path"
repository   = "https://github.com/lxl66566/punch-hole"
license      = "MIT OR Apache-2.0"
publish      = false

[[bin]]
name = "punch-demo"
path = "src/main.rs"

[dependencies]
anyhow     = "1.0.104"
bytes      = "1.12.1"
clap       = { version = "4.6.7", features = ["derive"] }
punch-hole = { path = "../..", version = "0.1.0" }
rand       = "0.10.3"
tokio      = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "deny"
unused_qualifications = "warn"
