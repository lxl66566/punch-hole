name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  check:
    name: cargo check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The socket layer branches per platform, so every leg compiles
        # and runs the suite on its own OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --no-symlinks cargo-nextest
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: loopback aliases
        # macOS binds only 127.0.0.1 on lo0; the NAT lab draws its public
        # addresses from 127.0.0.2-254 there.
        if: runner.os == 'macOS'
        run: for i in $(seq 2 254); do sudo ifconfig lo0 alias 127.0.0.$i up; done
      - name: cargo test
        run: cargo nextest run --workspace --all-features --locked --no-tests pass && cargo test --workspace --all-features --locked --doc

  msrv:
    name: cargo check (msrv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Keep the pin in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features --locked
