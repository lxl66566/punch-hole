[package]
name         = "punch-hole"
version      = "0.1.0"
edition      = "2024"
# Let chains in edition 2024 set the real floor; 1.85 cannot compile the
# crate.
rust-version = "1.88"
description  = "Signaling-agnostic UDP hole punching primitives"
repository   = "https://github.com/lxl66566/punch-hole"
license      = "MIT OR Apache-2.0"
keywords     = ["hole-punching", "nat", "p2p", "stun", "udp"]
categories   = ["network-programming"]
# The book sources ship with the package (~150 KB of markdown): the README
# sends readers to docs/en/src and docs/zh/src, and built books land in
# target/book, never inside docs/.
include      = [
  "/LICENSE-*",
  "/README.md",
  "/docs/**",
  "/examples/**",
  "/src/**",
  "/tests/**",
]

[workspace]
members = ["crates/nat-lab"]

[dependencies]
bytes      = "1.12.1"
nat-lab    = { path = "crates/nat-lab", version = "0.1.0", optional = true }
postcard   = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand       = "0.10.3"
serde      = { version = "1.0.229", features = ["derive"] }
socket2    = "0.6.5"
thiserror  = "2.0.21"
tokio      = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }

# If you are building bin target, uncomment this
# [profile.release]
# lto       = true
# opt-level = "s"
# panic     = "abort"
# strip     = true

[features]
default   = []
# The nat-lab engines, plus the seam trait implementations that let their
# hosts and sockets drive a session.
test-util = ["dep:nat-lab"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
# cargo-fuzz builds the library with --cfg fuzzing.
unexpected_cfgs       = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
# The single FFI call in socket/sys.rs carries a scoped exemption.
unsafe_code           = "deny"
unused_qualifications = "warn"
