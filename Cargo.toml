[package]
name         = "punch-hole"
version      = "0.1.0"
edition      = "2024"
# Let chains in edition 2024 set the real floor; 1.85 cannot compile the
# crate.
rust-version = "1.88"
description  = "Signaling-agnostic UDP hole punching primitives"
repository   = "https://github.com/lxl66566/punch-hole"
license      = "MIT OR Apache-2.0"
keywords     = ["udp", "hole-punching", "nat", "p2p", "stun"]
categories   = ["network-programming"]
include      = ["/CHANGELOG.md", "/LICENSE-*", "/README.md", "/benches/**", "/examples/**", "/src/**", "/tests/**"]

[features]
default = []
# In-tree NAT simulator and the test-only socket seam.
test-util = []

[dependencies]
bytes = "1.12.1"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "sync", "rt", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unused_qualifications = "warn"
# The single FFI call in socket/sys.rs carries a scoped exemption.
unsafe_code            = "deny"
# cargo-fuzz builds the library with --cfg fuzzing.
unexpected_cfgs       = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }

# If you are building bin target, uncomment this
# [profile.release]
# lto       = true
# opt-level = "s"
# panic     = "abort"
# strip     = true
