[package]
name    = "punch-hole-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Keeps the fuzz crate out of any workspace declared around the library.
[workspace]

[[bin]]
bench = false
doc   = false
name  = "fuzz_sig_frame"
path  = "fuzz_targets/fuzz_sig_frame.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_data_packet"
path  = "fuzz_targets/fuzz_data_packet.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_stun"
path  = "fuzz_targets/fuzz_stun.rs"
test  = false

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.punch-hole]
path = ".."
